name: Keep Render Backend Warm

on:
  schedule:
    # Every 10 minutes, 06:00-23:00 UTC — tune to your user base's timezone
    # spread. A truly idle overnight window is left alone on purpose.
    - cron: '*/10 6-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://gymbro-api.onrender.com/health || echo "Ping failed (non-blocking)"
